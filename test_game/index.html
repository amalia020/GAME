<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Walk</title>
    <style>
      /* chunky rounded toon UI font (self-hosted, offline-safe) */
      @font-face {
        font-family: 'Baloo 2'; font-style: normal; font-weight: 700; font-display: swap;
        src: url('/fonts/baloo2-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Baloo 2'; font-style: normal; font-weight: 800; font-display: swap;
        src: url('/fonts/baloo2-800.woff2') format('woff2');
      }
      :root { --toon-font: 'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #82C9C4; font-family: var(--toon-font); }
      * { box-sizing: border-box; }
      .hint {
        position: fixed; left: 16px; bottom: 14px; z-index: 10;
        font-family: var(--toon-font); font-weight: 700; font-size: 14px;
        color: #4a3a24; background: rgba(244,236,216,0.92);
        padding: 6px 12px; border: 2px solid #7a5c3d; border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="hint">WASD / arrows to walk</div>
    <script type="module" src="/src/main.tsx"></script>
